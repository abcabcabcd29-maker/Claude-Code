<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soulor · 灵镜 — 一夜</title>
<meta name="description" content="你对外的一切，都源自那个内核。翻页，看一个内核如何在一夜之间点亮。">
<meta name="theme-color" content="#050409">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="font.css">
<style>
/* ═══════════════════════════════════════════════════════════════
   「一夜」v2 —— 一格一格的整页电影（Trev 2026-08-02：「每拉一下下一格，
   表现更稳定」+「画面连起来像故事」）。
   · 翻页：#deck 是 scroll-snap mandatory 的翻页容器，一次手势 = 一章。
   · 衔接：章与章之间各有一段 5s 的「衔接镜头」（Seedance 首帧=上一章、
     尾帧=下一章生成），翻页的滚动分数直接搓它的时间轴——慢拖 = 亲手推运镜，
     快翻 = 一个利落的电影剪辑。素材没到位时回落到交叉溶解+黑场沉降。
   · 文字：到章即入场（时间驱动的编舞），离章即退场。
   · 每格的循环视频、降级路径、手势解锁播放，与 v1 相同。
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#050409;--ink:#F2EDE4;--ink2:#B9AFC4;--mut:#8B8395;
  --core:#FFD9A0;--core2:#E5B584;--line:#26202E;
  --serif:"Instrument Serif",Georgia,serif;   /* 🔴 只给拉丁与数字，永不套中文 */
  --sans:"PingFang SC","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);overflow:hidden}
body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--core);color:var(--bg)}

/* ── 舞台（z0）：影片层 ── */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease}
.scene.on{opacity:1;visibility:visible;transition:none}
.scene.xfade{transition:opacity .1s linear}
.scene .poster,.scene video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;background-size:cover;background-position:center;
}
.scene video{opacity:0;transition:opacity .8s ease}
.scene video.ready{opacity:1}
.scene.kenburns .poster{animation:kb 46s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
/* 衔接镜头层：盖在两章之上，只在翻页途中出现 */
.bridge{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;visibility:hidden}
.bridge.on{opacity:1;visibility:visible}
#dip{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(140% 110% at 50% 42%, transparent 58%, rgba(5,4,9,.42) 100%),
    linear-gradient(to top, rgba(5,4,9,.62) 0%, transparent 34%);
}
#grain{position:absolute;inset:-60px;pointer-events:none;opacity:.05;mix-blend-mode:overlay}

/* ── 翻页容器（z10）：章节与字幕都住在这 ── */
#deck{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;z-index:10;
  scroll-snap-type:y mandatory;scrollbar-width:none}
#deck::-webkit-scrollbar{display:none}
.chapter{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always}

.block{position:absolute;z-index:1;max-width:min(720px,80vw)}
.block.bl{left:clamp(24px,7vw,110px);bottom:clamp(84px,16vh,160px)}
.block.br{right:clamp(24px,7vw,110px);bottom:clamp(84px,16vh,160px);text-align:right}
.block.ml{left:clamp(24px,7vw,110px);top:50%;transform:translateY(-50%)}
.block.cc{left:50%;top:50%;transform:translate(-50%,-46%);text-align:center;width:min(1080px,92vw);max-width:none}
/* 文字后面垫一层近黑渐隐（不带色相）——正文压在动图亮部上会发蒙，这层就是解药 */
.block::before{content:'';position:absolute;inset:-9% -8%;z-index:-1;
  background:radial-gradient(62% 72% at 50% 55%,rgba(5,4,9,.52),transparent 76%)}
.cc .eyebrow{color:var(--ink2);text-shadow:0 0 16px rgba(5,4,9,.9),0 1px 4px rgba(5,4,9,.85)}
.eyebrow{
  font-family:var(--mono);font-size:clamp(10px,.8vw,12px);letter-spacing:.34em;
  color:var(--mut);margin-bottom:clamp(14px,2.2vh,26px);white-space:nowrap;
  opacity:0;transition:opacity .7s ease .05s;
}
.eyebrow b{color:var(--core);font-weight:400}
h1{
  font-weight:600;font-size:clamp(34px,4.9vw,72px);line-height:1.18;
  letter-spacing:.01em;text-wrap:balance;
  text-shadow:0 1px 3px rgba(5,4,9,.65),0 0 22px rgba(5,4,9,.5);
}
.cc h1{font-size:clamp(38px,6.4vw,104px)}
.line{display:block;overflow:hidden}
.line>span{display:inline-block;white-space:nowrap;transform:translateY(112%);opacity:0;
  transition:transform .85s cubic-bezier(.22,1,.36,1),opacity .85s ease}
.line:nth-child(2)>span{transition-delay:.12s}
.cc .line>span{margin-inline-end:-.5em}
.en{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:clamp(15px,1.5vw,22px);color:var(--core2);
  margin-top:clamp(12px,1.8vh,20px);letter-spacing:0;
  opacity:0;transition:opacity .8s ease .38s;
  text-shadow:0 1px 3px rgba(5,4,9,.7);
}
.body{
  font-size:clamp(13.5px,1.05vw,16.5px);line-height:1.9;color:var(--ink2);
  margin-top:clamp(14px,2.4vh,26px);max-width:36em;
  opacity:0;transition:opacity .8s ease .5s;
  text-shadow:0 1px 3px rgba(5,4,9,.8);
}
.br .body{margin-left:auto}
.cc .body{margin-inline:auto}
.formula{margin-top:clamp(10px,1.6vh,18px);font-size:clamp(12.5px,.95vw,15px);color:var(--mut);
  opacity:0;transition:opacity .8s ease .62s}
.formula i{font-family:var(--serif);font-style:italic;color:var(--core2);font-size:1.15em}
.num{
  position:absolute;font-family:var(--serif);font-weight:400;font-style:italic;
  font-size:clamp(180px,34vh,380px);line-height:1;color:var(--ink);opacity:0;
  pointer-events:none;user-select:none;transition:opacity 1.2s ease .15s;
}
.bl .num,.ml .num{right:-4vw;bottom:-2vh}.br .num{left:-4vw;bottom:-2vh}
/* 入场态：到章加 .in，一切各就各位 */
.chapter.in .eyebrow,.chapter.in .en,.chapter.in .body,.chapter.in .formula{opacity:1}
.chapter.in .num{opacity:.045}
.chapter.in .line>span{transform:none;opacity:1}
/* 幽灵短语（第 1 章） */
.ghost{
  position:absolute;z-index:0;font-size:clamp(12px,1.2vw,17px);color:#CBC2D6;opacity:0;
  letter-spacing:.06em;white-space:nowrap;filter:blur(.3px);
  transition:opacity 1.4s ease;
}
.chapter.in .ghost{opacity:.42;animation:drift 14s ease-in-out infinite alternate}
.chapter.in .ghost:nth-of-type(2){transition-delay:.5s;animation-delay:-4s}
.chapter.in .ghost:nth-of-type(3){transition-delay:1s;animation-delay:-8s}
.chapter.in .ghost:nth-of-type(4){transition-delay:1.5s;animation-delay:-11s}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-18px)}}
/* 星球标签（第 7 章，桌面）：DOM 画的，字永远是锐的——烤在视频里的那种蒙不再需要 */
.plab{
  position:absolute;z-index:1;font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;
  color:var(--core2);opacity:0;transition:opacity .9s ease;pointer-events:none;
  text-shadow:0 1px 3px rgba(5,4,9,.9);padding-top:10px;
}
.plab::before{content:'';position:absolute;left:50%;top:-6px;width:1px;height:12px;background:var(--core2);opacity:.55}
.chapter.in .plab{opacity:.8}
.chapter.in .plab:nth-of-type(2){transition-delay:.15s}
.chapter.in .plab:nth-of-type(3){transition-delay:.3s}
.chapter.in .plab:nth-of-type(4){transition-delay:.45s}

/* ── 常驻件（z40）── */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:clamp(16px,2.6vh,26px) clamp(20px,3.4vw,48px);pointer-events:none;
}
#nav a,#nav button{pointer-events:auto}
.mark{color:var(--ink);text-decoration:none;font-size:15px;display:flex;align-items:baseline;gap:9px}
.mark .lat{font-family:var(--serif);font-size:19px;letter-spacing:-.022em}
.mark .zh{color:var(--ink2);font-size:12.5px;letter-spacing:.3em}
.navr{display:flex;align-items:center;gap:14px}
#snd{
  background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;padding:8px 14px;cursor:pointer;
  transition:color .3s,border-color .3s;
}
#snd.on{color:var(--core);border-color:var(--core2)}
.pill{
  font-size:12.5px;letter-spacing:.14em;color:var(--bg);background:var(--core);
  text-decoration:none;padding:9px 18px;border-radius:999px;font-weight:600;
  transition:transform .25s ease, box-shadow .25s ease;
}
.pill:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(255,217,160,.25)}
#rail{position:fixed;left:clamp(14px,2vw,30px);top:50%;transform:translateY(-50%);
  z-index:40;height:42vh;display:flex;flex-direction:column;align-items:center}
#railline{position:relative;width:1px;flex:1;background:var(--line)}
#railfill{position:absolute;top:0;left:0;width:1px;height:0%;background:var(--core)}
.tick{position:absolute;left:-2.5px;width:6px;height:1px;background:var(--mut);opacity:.55}
#chlabel{
  position:fixed;left:clamp(14px,2vw,30px);bottom:26px;z-index:40;
  font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--mut);
  writing-mode:vertical-rl;text-orientation:sideways;opacity:.8;
}
#hint{
  position:fixed;bottom:clamp(18px,4vh,40px);left:50%;transform:translateX(-50%);z-index:40;
  font-size:12px;letter-spacing:.28em;color:var(--mut);transition:opacity .6s;pointer-events:none;
}
#hint b{color:var(--core);font-weight:400}
/* 结尾 CTA */
.finale{pointer-events:auto}
.finale .cta{
  display:inline-block;margin-top:clamp(22px,4vh,40px);white-space:nowrap;
  background:var(--core);color:var(--bg);text-decoration:none;font-weight:700;
  font-size:clamp(14px,1.2vw,17px);letter-spacing:.06em;
  padding:clamp(13px,1.6vh,17px) clamp(24px,3vw,44px);border-radius:999px;
  opacity:0;transition:opacity .8s ease .6s, transform .25s ease, box-shadow .25s ease;
}
.finale .cta:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(255,217,160,.3)}
.finale .alt{margin-top:18px;font-size:13px;color:var(--mut);opacity:0;transition:opacity .8s ease .72s}
.finale .alt a{color:var(--ink2);text-underline-offset:3px}
.finale .foot{margin-top:clamp(30px,7vh,64px);font-family:var(--mono);
  font-size:10px;letter-spacing:.3em;color:var(--mut);line-height:2;
  opacity:0;transition:opacity .8s ease .84s}
.chapter.in .cta,.chapter.in .alt,.chapter.in .foot{opacity:1}

@media(max-width:820px){
  .block.bl,.block.br,.block.ml{
    left:22px;right:22px;bottom:clamp(76px,13vh,120px);top:auto;transform:none;text-align:left;max-width:none}
  .br .body{margin-left:0}
  h1{font-size:clamp(30px,8.6vw,44px)}
  .cc h1{font-size:clamp(34px,9.6vw,50px)}
  .num{font-size:150px;right:-14px;bottom:-8px;left:auto}
  #rail,#chlabel{display:none}
  .mark .zh{display:none}
  .eyebrow{letter-spacing:.22em;font-size:10px}
  .plab{display:none}
  #snd{padding:7px 11px}
}
@media(prefers-reduced-motion:reduce){
  .scene,.scene video,#dip,.line>span,.eyebrow,.en,.body,.num,.formula,
  .finale .cta,.finale .alt,.finale .foot{transition:none!important}
  .scene.kenburns .poster,.chapter.in .ghost{animation:none}
  .chapter .line>span{transform:none;opacity:1}
  .chapter .eyebrow,.chapter .en,.chapter .body,.chapter .formula{opacity:1}
  .chapter .num{opacity:.045}
  .chapter .cta,.chapter .alt,.chapter .foot{opacity:1!important}
}
</style>
</head>
<body>

<div id="stage"></div>

<header id="nav">
  <a class="mark" href="https://soulor.id/"><span class="lat">Soulor</span><span class="zh">灵 镜</span></a>
  <div class="navr">
    <button id="snd" type="button" aria-pressed="false">声音 ·关</button>
    <a class="pill" href="https://testflight.apple.com/join/Y5j5XjUU" target="_blank" rel="noopener">进内测 →</a>
  </div>
</header>
<div id="rail" aria-hidden="true"><div id="railline"><div id="railfill"></div></div></div>
<div id="chlabel" aria-hidden="true"></div>
<div id="hint">往下 · 一格是一幕 <b>↓</b></div>

<main id="deck"></main>
<audio id="bgm" loop preload="none" src="bgm.m4a"></audio>

<script>
/* ══ 数据：品牌故事十幕（BRAND.md §2 原文） ══ */
var CH=[
{pos:'cc',num:'',eyebrow:'SOULOR · 灵镜 · 2026',
 h:['你对外的一切，','都源自那个内核。'],
 en:'Everything you show the world begins at the core.',
 body:'Soulor 接住你随口说的话，替你把内核存下来。今晚，它会写成日记。',
 op:'55% 40%'},
{pos:'bl',num:'01',eyebrow:'01 · 虚无 / <b>THE SCATTER</b>',
 h:['你每天说几千句话，','留下来的是零。'],
 en:'A galaxy of dust. Everywhere, and nowhere.',
 body:'深夜的胡思乱想、没发出去的消息、对朋友说过就忘的那句真话——蒸发得比你想的快。你的内心一直在说话，只是从来没有人记下来。',
 op:'62% 50%',
 ghosts:[['算了，没什么','14%','22%'],['其实我挺累的','64%','18%'],['这话跟谁说呢','58%','48%'],['明天再想吧','70%','34%']]},
{pos:'bl',num:'02',eyebrow:'02 · 第一句 / <b>ONE GRAIN</b>',
 h:['说一句，','就落下一粒。'],
 en:'One sentence. One grain of matter.',
 body:'Drop——随口一句就走。AI 接住它、归好类，不评判、不给建议。说完这件事就结束了，剩下的交给引力。',
 op:'68% 35%'},
{pos:'br',num:'03',eyebrow:'03 · 聚拢 / <b>GRAVITY</b>',
 h:['想聊透的时候，','引力会变大。'],
 en:'Gravity does the gathering.',
 body:'Chat——想聊透一件事。它见证式地回应，把你的话一层层拆开听懂，最后问你一句：这样理解，对吗？不知道说什么的时候，抽一张回响牌。',
 op:'62% 38%'},
{pos:'bl',num:'04',eyebrow:'04 · 点亮 / <b>FIRST LIGHT</b>',
 h:['到了晚上，','它亮了。'],
 en:'At night, it ignites.',
 body:'白天随口说过的话，23:59 自动写成一篇日记——用你的原话，不加想象。你不用写日记。你只要说话，日记自己会来。',
 op:'62% 40%'},
{pos:'bl',num:'05',eyebrow:'05 · 成形 / <b>THE SUN TAKES SHAPE</b>',
 h:['攒够证据，','它才开口说你是谁。'],
 en:'It speaks only with evidence.',
 body:'六个品类的人格声音 × 四个生活场景——每一条判断都标着依据，点开就是你的原话。判断永远可反驳：镜子不产生你，它只让你看见。',
 op:'70% 35%'},
{pos:'ml',num:'06',eyebrow:'06 · 诚实 / <b>IT SAYS WHEN IT\'S UNSURE</b>',
 h:['证据不够的时候，','它会直说还不够。'],
 en:'It tells you when it doesn\'t know yet.',
 body:'宁可慢，也不给你一个看起来很懂你、其实没有依据的结论。这是产品的铁律，不是一句文案。',
 op:'66% 36%'},
{pos:'bl',num:'07',eyebrow:'07 · 照亮 / <b>ONE CORE, EVERY PLANET</b>',
 h:['一个内核，','照亮所有星球。'],
 en:'One core. Every planet lit.',
 body:'现在，每个 app 都在从零猜你是谁：约会软件让你填一遍标签，招聘平台让你再写一遍自我介绍。内核只该被采集一次——而且该由你自己持有。这就是 Soulor ID：你的太阳系，中心是你。',
 formula:true,
 op:'55% 45%',mop:'30% 28%',
 plabs:[['约会','69%','44%'],['招聘','83%','67%'],['陪伴','59%','84%'],['还没被发明的','90%','36%']]},
{pos:'bl',num:'08',eyebrow:'08 · 主权 / <b>YOURS ALONE</b>',
 h:['这一切，','只发生在你的手机里。'],
 en:'It never leaves your hand.',
 body:'数据只在你手机里。不是「承诺不看」，是架构上就没有上传。它接住你，不指导你的人生。每条判断都翻得回原话，也都删得掉。',
 op:'66% 36%'},
{pos:'cc',num:'09',eyebrow:'09 · 第一句 / <b>BEGIN</b>',
 h:['从你的第一句开始。'],
 en:'Begin with one sentence.',
 body:'现在是 iOS 内测阶段——用 TestFlight 装上就能说话。',
 op:'50% 32%',finale:true},
];
var N=CH.length;

/* ══ 环境 ══ */
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var nc=navigator.connection||{};
var noVideo=reduce||nc.saveData||/(^|-)2g$/.test(nc.effectiveType||'')||location.protocol==='file:';
var narrowScreen=matchMedia('(max-width:820px)').matches;

/* ══ 搭 DOM：舞台（影片）+ 翻页容器（章节/字幕） ══ */
var stage=document.getElementById('stage');
var deck=document.getElementById('deck');
CH.forEach(function(c,i){
  var sc=document.createElement('div');sc.className='scene';
  var po=document.createElement('div');po.className='poster';po.setAttribute('aria-hidden','true');
  po.style.backgroundImage='url(ch'+i+'.jpg)';
  po.style.backgroundPosition=(narrowScreen&&c.mop)?c.mop:c.op;
  sc.appendChild(po);
  if(!noVideo){
    var v=document.createElement('video');
    v.muted=true;v.defaultMuted=true;v.loop=true;v.playsInline=true;v.preload='none';
    v.setAttribute('muted','');v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');
    v.setAttribute('aria-hidden','true');
    v.style.objectPosition=(narrowScreen&&c.mop)?c.mop:c.op;
    v.addEventListener('canplay',function(){v.classList.add('ready');});
    v.addEventListener('error',function(){
      v.classList.remove('ready');
      if(/\.webm$/.test(v.currentSrc||'')&&!v.dataset.fellBack){
        v.dataset.fellBack='1';v.src='ch'+i+'.mp4';v.load();return;
      }
      sc.classList.add('kenburns');
    },true);
    sc.appendChild(v);
  } else sc.classList.add('kenburns');
  stage.appendChild(sc);

  var sec=document.createElement('section');sec.className='chapter';sec.dataset.i=i;
  var bk=document.createElement('div');bk.className='block '+c.pos;
  var htm='';
  if(c.num) htm+='<div class="num" aria-hidden="true">'+c.num+'</div>';
  htm+='<div class="eyebrow">'+c.eyebrow+'</div>';
  htm+='<h1>'+c.h.map(function(l){return '<span class="line"><span>'+l+'</span></span>';}).join('')+'</h1>';
  htm+='<p class="en">'+c.en+'</p>';
  htm+='<p class="body">'+c.body+'</p>';
  if(c.formula) htm+='<p class="formula"><i>Soul</i>（灵魂） + <i>or</i>（镜子） = <i>Soulor</i>（<i>Solar</i>，太阳）</p>';
  if(c.finale){
    bk.classList.add('finale');
    htm+='<a class="cta" href="https://testflight.apple.com/join/Y5j5XjUU" target="_blank" rel="noopener">用 TestFlight 安装 →</a>'
       +'<p class="alt">或者写信：<a href="mailto:hello@soulor.id">hello@soulor.id</a></p>'
       +'<p class="foot">Soulor · 灵镜 — 一面灵魂的镜子<br>SOULOR.ID · © 2026</p>';
  }
  bk.innerHTML=htm;
  sec.appendChild(bk);
  if(c.ghosts) c.ghosts.forEach(function(g){
    var s=document.createElement('span');s.className='ghost';s.textContent=g[0];
    s.style.left=g[1];s.style.top=g[2];sec.appendChild(s);
  });
  if(c.plabs) c.plabs.forEach(function(g){
    var s=document.createElement('span');s.className='plab';s.textContent=g[0];
    s.style.left=g[1];s.style.top=g[2];s.style.transform='translateX(-50%)';sec.appendChild(s);
  });
  deck.appendChild(sec);
});
var dip=document.createElement('div');dip.id='dip';dip.setAttribute('aria-hidden','true');stage.appendChild(dip);
var vig=document.createElement('div');vig.id='vig';vig.setAttribute('aria-hidden','true');stage.appendChild(vig);
var scenes=[].slice.call(stage.querySelectorAll('.scene'));
var sections=[].slice.call(deck.querySelectorAll('.chapter'));

/* 衔接镜头：br{k} = 第 k 章 → 第 k+1 章。素材可以不存在（error → 永远用溶解兜底） */
var bridges=[];
function bridgeFor(k){
  if(noVideo||k<0||k>=N-1) return null;
  if(bridges[k]!==undefined) return bridges[k];
  var v=document.createElement('video');
  v.className='bridge';v.muted=true;v.defaultMuted=true;v.playsInline=true;v.preload='auto';
  v.setAttribute('muted','');v.setAttribute('playsinline','');v.setAttribute('aria-hidden','true');
  var webm=v.canPlayType('video/webm; codecs="vp9"');
  v.src='br'+k+((webm==='probably'||webm==='maybe')?'.webm':'.mp4');
  v.addEventListener('error',function(){
    if(/\.webm$/.test(v.currentSrc||'')&&!v.dataset.fellBack){
      v.dataset.fellBack='1';v.src='br'+k+'.mp4';v.load();return;
    }
    bridges[k]=null;             // 彻底没有 → 以后都走溶解
    if(v.parentNode)v.parentNode.removeChild(v);
  },true);
  v.load();
  stage.insertBefore(v,dip);     // 在场景之上、黑场之下
  bridges[k]=v;
  return v;
}

/* ══ 胶片颗粒 ══ */
(function(){
  var g=document.createElement('div');g.id='grain';g.setAttribute('aria-hidden','true');
  var c=document.createElement('canvas');c.width=c.height=128;
  var x=c.getContext('2d'),im=x.createImageData(128,128);
  for(var i=0;i<im.data.length;i+=4){var nz=(Math.random()*255)|0;
    im.data[i]=im.data[i+1]=im.data[i+2]=nz;im.data[i+3]=255;}
  x.putImageData(im,0,0);
  g.style.background='url('+c.toDataURL()+')';
  stage.appendChild(g);
  if(!reduce){var f=0;setInterval(function(){f=(f+1)%3;
    g.style.transform='translate('+(f*17)+'px,'+(f*-23)+'px)';},120);}
})();

/* ══ 章节视频装载/卸载 ══ */
function srcFor(i){
  var v=scenes[i].querySelector('video');if(!v||v.dataset.src) return v;
  var webm=v.canPlayType('video/webm; codecs="vp9"');
  v.src='ch'+i+((webm==='probably'||webm==='maybe')?'.webm':'.mp4');
  v.dataset.src='1';v.preload='auto';v.load();
  return v;
}
function ensureLoaded(i){
  for(var k=Math.max(0,i-1);k<=Math.min(N-1,i+1);k++) srcFor(k);
  bridgeFor(i);bridgeFor(i-1);
  scenes.forEach(function(s,k){
    if(Math.abs(k-i)<=1)return;
    var vv=s.querySelector('video');
    if(vv&&vv.dataset.src){
      vv.removeAttribute('src');vv.load();
      delete vv.dataset.src;vv.classList.remove('ready');
    }
  });
  bridges.forEach(function(b,k){
    if(!b)return;
    if(k<i-1||k>i+1){
      if(b.parentNode)b.parentNode.removeChild(b);
      bridges[k]=undefined;
    }
  });
}

/* ══ 播放（含被拒断路 + 手势解锁）══ */
var playFail=[],playBlocked=false,gestureArmed=false,cur=-1;
function tryPlay(v,i){
  if(playBlocked){ scenes[i]&&scenes[i].classList.add('kenburns'); return; }
  var now=performance.now();
  if(v.dataset.lastTry&&now-v.dataset.lastTry<1000) return;
  v.dataset.lastTry=now;
  var pr=v.play();
  if(pr&&pr.catch)pr.catch(function(){
    playFail[i]=(playFail[i]||0)+1;
    if(playFail[i]>=3){
      playBlocked=true;
      scenes.forEach(function(s){s.classList.add('kenburns');});
      if(!gestureArmed){
        gestureArmed=true;
        var unlock=function(){
          playBlocked=false;playFail=[];
          scenes.forEach(function(s){s.classList.remove('kenburns');});
          var vv=cur>=0&&scenes[cur].querySelector('video');
          if(vv){delete vv.dataset.lastTry;tryPlay(vv,cur);}
        };
        addEventListener('pointerdown',unlock,{once:true});
        addEventListener('touchend',unlock,{once:true});
        addEventListener('keydown',unlock,{once:true});
      }
    }
  });
}
var seeking={},pending={};
function seekTo(v,key,t){
  if(!isFinite(v.duration)||v.duration<=0) return;
  t=Math.min(Math.max(0,t),v.duration-0.06);
  if(seeking[key]){pending[key]=t;return;}
  seeking[key]=true;
  try{v.currentTime=t;}catch(e){seeking[key]=false;}
}
function armSeek(v,key){
  if(v.dataset.seekArmed)return;
  v.dataset.seekArmed='1';
  v.addEventListener('seeked',function(){
    seeking[key]=false;
    if(pending[key]!=null){var t=pending[key];pending[key]=null;seekTo(v,key,t);}
  });
}

/* ══ 引擎：snap 翻页 + 衔接镜头 ══ */
var railfill=document.getElementById('railfill');
var railline=document.getElementById('railline');
var chlabel=document.getElementById('chlabel');
var hint=document.getElementById('hint');
CH.forEach(function(_,k){
  var t=document.createElement('div');t.className='tick';
  t.style.top=(k/(N-1)*100)+'%';railline.appendChild(t);
});
var activeBridge=-1;
function frame(){
  requestAnimationFrame(frame);
  var H=deck.clientHeight||1;
  var f=deck.scrollTop/H;                    // 章节浮点：3.42 = 正在 3→4 的路上 42%
  var k=Math.max(0,Math.min(N-1,Math.round(f)));
  var base=Math.floor(f), frac=f-base;
  var inTransit=frac>0.02&&frac<0.98&&base<N-1;

  /* 到章/离章 */
  if(k!==cur){
    scenes.forEach(function(s,j){s.classList.toggle('on',j===k);});
    sections.forEach(function(s,j){s.classList.toggle('in',j===k);});
    var v0=cur>=0&&scenes[cur].querySelector('video');
    if(v0&&!v0.paused)v0.pause();
    cur=k;ensureLoaded(k);
    chlabel.textContent=k?CH[k].eyebrow.replace(/<[^>]*>/g,'').split('/')[0].trim():'';
  }

  /* 翻页途中：衔接镜头搓 frac；没有素材 → 交叉溶解 + 黑场沉降 */
  var br=inTransit?bridges[base]:null;
  if(inTransit&&br&&br.readyState>=2){
    if(activeBridge!==base){
      if(activeBridge>=0&&bridges[activeBridge])bridges[activeBridge].classList.remove('on');
      br.classList.add('on');armSeek(br,'b'+base);activeBridge=base;
    }
    if(!br.paused)br.pause();
    seekTo(br,'b'+base,frac*(br.duration||5));
    dip.style.opacity=0;
  }else{
    if(activeBridge>=0){
      if(bridges[activeBridge])bridges[activeBridge].classList.remove('on');
      activeBridge=-1;
    }
    if(inTransit){
      /* 溶解：两章都显影，按 frac 换透明度；中点轻沉一下（电影黑场） */
      scenes.forEach(function(s,j){
        var on=(j===base||j===base+1);
        s.classList.toggle('xfade',on);
        s.style.opacity=on?(j===base?1-frac:frac):'';
        s.style.visibility=on?'visible':'';
      });
      dip.style.opacity=Math.max(0,1-Math.abs(frac-0.5)/0.5)*0.5;
    }else{
      scenes.forEach(function(s){s.classList.remove('xfade');s.style.opacity='';s.style.visibility='';});
      dip.style.opacity=0;
    }
  }

  /* 稳定态：本章循环播放 */
  var v=scenes[k].querySelector('video');
  if(v&&v.dataset.src&&v.readyState>=2&&v.paused&&!document.hidden)tryPlay(v,k);

  railfill.style.height=(f/(N-1)*100)+'%';
  hint.style.opacity=deck.scrollTop<60?1:0;
}
ensureLoaded(0);
requestAnimationFrame(frame);
setTimeout(function(){sections[0].classList.add('in');scenes[0].classList.add('on');},60);

/* 键盘翻页：末章向下 no-op（别把正要点 CTA 的人拽走） */
addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var k=e.key,d=0;
  if(k===' ')d=e.shiftKey?-1:1;
  else if(k==='ArrowDown'||k==='PageDown')d=1;
  else if(k==='ArrowUp'||k==='PageUp')d=-1;
  if(!d)return;e.preventDefault();
  var H=deck.clientHeight,t=Math.round(deck.scrollTop/H)+d;
  if(t>=N||t<0)return;
  deck.scrollTo({top:t*H,behavior:reduce?'auto':'smooth'});
});
/* resize：钉回最近的整章，别停在半路 */
addEventListener('resize',function(){
  var H=deck.clientHeight;
  deck.scrollTop=Math.round(deck.scrollTop/H)*H;
});

/* ══ 声音：默认关；点按钮=手势，可以直接播 ══ */
var bgm=document.getElementById('bgm');
var snd=document.getElementById('snd');
var sndOn=false;
bgm.volume=0;
function fadeVol(to,ms){
  var from=bgm.volume,t0=performance.now();
  (function step(){
    var p=Math.min(1,(performance.now()-t0)/ms);
    bgm.volume=from+(to-from)*p;
    if(p<1)requestAnimationFrame(step);
    else if(to===0)bgm.pause();
  })();
}
snd.addEventListener('click',function(){
  sndOn=!sndOn;
  snd.classList.toggle('on',sndOn);
  snd.setAttribute('aria-pressed',sndOn?'true':'false');
  snd.textContent=sndOn?'声音 ·开':'声音 ·关';
  try{localStorage.setItem('soulor-snd',sndOn?'1':'0');}catch(e){}
  if(sndOn){bgm.play().then(function(){fadeVol(0.5,1800);}).catch(function(){});}
  else fadeVol(0,600);
});
/* 上次开过声音的人：不自动响（浏览器也不许），但把按钮点亮成提示 */
try{if(localStorage.getItem('soulor-snd')==='1'){snd.style.borderColor='var(--core2)';}}catch(e){}

document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    scenes.forEach(function(s){var v=s.querySelector('video');if(v&&!v.paused)v.pause();});
    if(!bgm.paused)bgm.pause();
  }else if(sndOn&&bgm.paused){bgm.play().catch(function(){});}
});
</script>
</body>
